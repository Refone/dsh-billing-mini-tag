name: Publish to npm

on:
  release:
    types: [published]

# 最小权限：checkout 只读，OIDC 令牌用于 npm Trusted Publishing
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取 GitHub 仓库代码（release 事件默认 checkout 对应 tag）
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 配置 Node.js 和 npm Registry
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # 3. 发布前检查
      #    这个包没有运行依赖，也没有 lockfile，所以不能用 npm ci。
      - name: Validate publishing requirements
        run: node scripts/check-release.mjs

      # 4. 运行测试
      - name: Run tests
        run: npm test

      # 5. 发布到 npm（认证走 Trusted Publishing / OIDC，无需 NPM_TOKEN）
      - name: Publish
        run: npm publish
