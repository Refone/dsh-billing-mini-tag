# dsh-lrf-hint — mount the plugin into a DSH profile.
#
# The node half (package.json exports ".") runs inside the host and only exists so
# the package becomes a Loader row; the browser half (exports "./client", served
# from /plugins by dsh-client-modules) registers a dock entry that portals the
# "LRF" label into the composer statistics row, right after the cache-hit pill.
#
# Install from this checkout:
#   dsh plugin --profile web add /Users/refone/Coding/dsh-billing-hint
# then refresh the Web GUI.
- insert:
    - id: dsh-lrf-hint
      name: 'dsh-lrf-hint'
