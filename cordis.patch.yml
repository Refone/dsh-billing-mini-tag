# dsh-billing-mini-tag — mount the plugin into a DSH profile.
#
# The node half (package.json exports ".") runs inside the host: it serves the
# Session-cost route, folds token usage, and refreshes the official quote on
# every Send. The browser half (exports "./client", served from /plugins by
# dsh-client-modules) registers a dock entry that portals the small "¥0.00"
# billing tag into the composer statistics row, right after the cache-hit pill.
#
# Install from this checkout:
#   dsh plugin --profile web add /Users/refone/Coding/dsh-billing-mini-tag
# then refresh the Web GUI.
- insert:
    - id: dsh-billing-mini-tag
      name: 'dsh-billing-mini-tag'
