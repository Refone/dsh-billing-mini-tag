# dsh-billing-mini-tag — profile patch for the DSH bundle.
#
# `package.json#dsh.bundle.patch` points here, which is what tells
# `dsh plugin add` that this package is a profile layer and not a plain
# library dependency.
#
# The host half (package.json export ".") serves
# GET /plugin-billing-mini-tag/cost, folds the session's token usage, and
# refreshes the official quote on Send. The browser half (export "./client",
# served by dsh-client-modules) registers the dock entry that portals the small
# `¥…` billing tag into the composer statistics row, right after the cache-hit
# pill.
- insert:
    - id: dsh-billing-mini-tag
      name: dsh-billing-mini-tag
